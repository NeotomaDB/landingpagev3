name: Deploy Landing Pages to S3

on:
  push:
    branches: [main, dev]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set environment based on branch
        id: bucket-name
        run: |
          if [[ ${{ github.ref }} == 'refs/heads/main' ]]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_ENV
            echo "AWS_BUCKET_NAME=${{secrets.AWS_BUCKET_NAME}}" >> "$GITHUB_ENV"
            echo "CFDISTRIBUTIONID=${{secrets.CFDISTRIBUTIONID}}" >> "$GITHUB_ENV"
            echo "VITE_APP_API_ENDPOINT=https://api.neotomadb.org" >> "$GITHUB_ENV"
          else
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
            echo "AWS_BUCKET_NAME=${{secrets.AWS_DEV_BUCKET_NAME}}" >> $GITHUB_ENV
            echo "CFDISTRIBUTIONID=${{secrets.CFDISTRIBUTIONID_DEV}}" >> "$GITHUB_ENV"
            echo "VITE_APP_API_ENDPOINT=https://api-dev.neotomadb.org" >> "$GITHUB_ENV"
          fi
          
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Must run after setup-node: corepack installs its shims into the active
      # Node's bin dir. The runner's global yarn is 1.x and refuses to run a
      # project whose package.json pins "packageManager": "yarn@4.x".
      - name: Enable Corepack
        run: corepack enable

      # setup-node's built-in `cache: yarn` is not used: it requires a committed
      # lockfile, and yarn.lock is gitignored in this repo.
      - name: Cache Yarn downloads
        uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      # --no-immutable is required because no lockfile is committed: Yarn 4
      # enables immutable installs automatically whenever CI=true, which would
      # fail on the lockfile it has to generate.
      - name: Install dependencies
        run: yarn install --no-immutable

      - name: Build
        run: yarn build

      - name: Deploying application to Amazon S3
        uses: dvelasquez/deploy-s3-action@main
        with:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_BUCKET_NAME: ${{ env.AWS_BUCKET_NAME }}
          BUCKET_PATH: "/${{github.event.number}}"
          DIST_LOCATION_CODE: ./dist
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - uses: badsyntax/github-action-aws-cloudfront@master
        name: Invalidate CloudFront Cache
        id: invalidate-cloudfront-cache
        with:
          distribution-id: ${{ env.CFDISTRIBUTIONID }}
          aws-region: 'us-east-1'
          origin-prefix: 'root'
          include-origin-prefix: true
          invalidate-paths: '/*'
          default-root-object: 'index.html'